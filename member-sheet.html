      return map[d] || d;
    }

      return 'difficulty-' + d;
    }

        filtered = filtered.filter(s => s.category === currentCategory);
      }

        filtered = filtered.filter(s =>

        );

          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('tab-active');
        btn.classList.add('text-slate-500');
      });
      event.target.classList.add('tab-active');
      event.target.classList.remove('text-slate-500');
      renderSheets();
    }

    function previewSheet(id) {
      currentSheet = sheets.find(s => s.id === id);
      document.getElementById('previewTitle').textContent = currentSheet.title;

      // 生成模拟乐谱预览内容
      const previewHTML = `
        <div class="text-center mb-6">
          <h2 class="text-2xl font-serif font-bold text-primary mb-2">${currentSheet.title}</h2>
          <p class="text-slate-500">作曲：${currentSheet.composer} · ${currentSheet.pages}页 · ${getDifficultyLabel(currentSheet.difficulty)}难度</p>
        </div>
        <div class="bg-slate-50 rounded-xl p-6 mb-4">
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <span class="font-bold text-slate-700">第 1 / ${currentSheet.pages} 页</span>
            <div class="flex gap-2">
              <button class="px-3 py-1 bg-white border rounded text-sm">上一页</button>
              <button class="px-3 py-1 bg-white border rounded text-sm">下一页</button>
            </div>
          </div>
          <div class="space-y-4">
            <!-- 模拟五线谱 -->
            <div class="bg-white rounded-lg p-4 shadow-sm">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-sm font-bold text-slate-700">Treble Clef</span>
                <span class="text-xs text-slate-400">♩ = 120</span>
              </div>
              <div class="space-y-3">
                ${Array(5).fill(0).map((_, i) => `
                  <div class="relative h-8">
                    <div class="absolute inset-x-0 top-0 h-px bg-slate-300"></div>
                    <div class="absolute inset-x-0 top-2 h-px bg-slate-300"></div>
                    <div class="absolute inset-x-0 top-4 h-px bg-slate-300"></div>
                    <div class="absolute inset-x-0 top-6 h-px bg-slate-300"></div>
                    <div class="absolute inset-x-0 top-8 h-px bg-slate-300"></div>
                    ${[2, 5, 8, 12, 15, 18, 22, 25].map(x => `
                      <div class="absolute top-${[0,1,2,3,4][Math.floor(Math.random()*5)]} left-[${x}%] w-3 h-3 bg-slate-800 rounded-full"></div>
                    `).join('')}
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="text-center text-slate-400 text-sm py-4">
              ── 更多内容请下载完整PDF ──
            </div>
          </div>
        </div>
        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-yellow-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
              <p class="text-sm text-yellow-800 font-medium">免费下载说明</p>
              <p class="text-xs text-yellow-700 mt-1">本乐谱为免费共享资源，仅供学习交流使用。部分古典乐谱来自 Mutopia Project（公有领域）。</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById('previewContent').innerHTML = previewHTML;
      document.getElementById('previewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('previewModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function downloadSheet() {
      if (currentSheet && currentSheet.url && currentSheet.url !== '#') {
        window.open(currentSheet.url, '_blank');
      }
      const toast = document.getElementById('downloadToast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function printSheet() {
      alert('打印功能：请将页面保存为PDF后打印，或前往琴和堂艺术中心获取高清打印版。');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderSheets();
    });

    renderSheets();
  </script>
</body>
</html>
