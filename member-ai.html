<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e3a5f">
  <title>AI音乐创作 | 琴和堂艺术中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e3a5f', secondary: '#c9a96e', accent: '#e63946' },
          fontFamily: { serif: ['Noto Serif SC','serif'], sans: ['Noto Sans SC','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; overscroll-behavior-y: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .wave-bar { animation: wave 1.2s ease-in-out infinite; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }
    @keyframes wave { 0%, 100% { height: 20%; } 50% { height: 100%; } }
    .glow { box-shadow: 0 0 30px rgba(201,169,110,0.3); }
    .note-float { animation: noteFloat 3s ease-in-out infinite; }
    @keyframes noteFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
    .typing::after { content: '|'; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-circle { transition: stroke-dashoffset 0.35s; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 顶部导航 -->
  <div class="bg-primary text-white sticky top-0 z-50">
    <div class="flex items-center justify-between px-4 h-14">
      <a href="member.html" class="flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span class="font-medium">返回</span>
      </a>
      <h1 class="font-serif font-bold text-lg">AI音乐创作</h1>
      <div class="w-16"></div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="max-w-2xl mx-auto px-4 py-6 pb-24">

    <!-- 标题区 -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 bg-primary/10 text-primary px-4 py-1.5 rounded-full text-sm font-medium mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        AI 智能作曲引擎 v2.0
      </div>
      <h2 class="text-2xl font-serif font-bold text-primary">用灵感创作旋律</h2>
      <p class="text-slate-500 text-sm mt-2">输入描述，AI 将为您生成独一无二的音乐作品</p>
    </div>

    <!-- 创作模式选择 -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <button onclick="setMode('melody')" class="mode-btn active bg-primary text-white p-4 rounded-xl text-center transition-all" data-mode="melody">
        <svg class="w-6 h-6 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
        <div class="text-sm font-medium">旋律生成</div>
      </button>
      <button onclick="setMode('harmony')" class="mode-btn bg-white border-2 border-slate-200 p-4 rounded-xl text-center transition-all" data-mode="harmony">
        <svg class="w-6 h-6 mx-auto mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
        <div class="text-sm font-medium text-slate-600">和声编配</div>
      </button>
      <button onclick="setMode('full')" class="mode-btn bg-white border-2 border-slate-200 p-4 rounded-xl text-center transition-all" data-mode="full">
        <svg class="w-6 h-6 mx-auto mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <div class="text-sm font-medium text-slate-600">完整编曲</div>
      </button>
    </div>

    <!-- 风格选择 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">选择风格</label>
      <div class="flex flex-wrap gap-2" id="styleTags">
        <button onclick="toggleStyle(this, 'classical')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">古典</button>
        <button onclick="toggleStyle(this, 'pop')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">流行</button>
        <button onclick="toggleStyle(this, 'jazz')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">爵士</button>
        <button onclick="toggleStyle(this, 'folk')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">民谣</button>
        <button onclick="toggleStyle(this, 'rock')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">摇滚</button>
        <button onclick="toggleStyle(this, 'electronic')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">电子</button>
        <button onclick="toggleStyle(this, 'chinese')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">中国风</button>
        <button onclick="toggleStyle(this, 'cinematic')" class="style-tag px-3 py-1.5 bg-white border border-slate-200 rounded-full text-sm text-slate-600 hover:border-primary hover:text-primary transition-all">电影配乐</button>
      </div>
    </div>

    <!-- 乐器选择 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">主奏乐器</label>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="selectInstrument(this, 'piano')" class="inst-btn active bg-primary text-white p-3 rounded-xl text-center text-xs transition-all" data-inst="piano">
          <div class="text-lg mb-1">🎹</div>
          <div>钢琴</div>
        </button>
        <button onclick="selectInstrument(this, 'guitar')" class="inst-btn bg-white border border-slate-200 p-3 rounded-xl text-center text-xs text-slate-600 transition-all" data-inst="guitar">
          <div class="text-lg mb-1">🎸</div>
          <div>吉他</div>
        </button>
        <button onclick="selectInstrument(this, 'violin')" class="inst-btn bg-white border border-slate-200 p-3 rounded-xl text-center text-xs text-slate-600 transition-all" data-inst="violin">
          <div class="text-lg mb-1">🎻</div>
          <div>小提琴</div>
        </button>
        <button onclick="selectInstrument(this, 'flute')" class="inst-btn bg-white border border-slate-200 p-3 rounded-xl text-center text-xs text-slate-600 transition-all" data-inst="flute">
          <div class="text-lg mb-1">🎵</div>
          <div>长笛</div>
        </button>
      </div>
    </div>

    <!-- 描述输入 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">描述您的灵感</label>
      <textarea id="promptInput" rows="3" placeholder="例如：一段忧伤的钢琴曲，像雨夜独自漫步的感觉..." 
        class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary resize-none"></textarea>
      <div class="flex gap-2 mt-2 flex-wrap">
        <button onclick="setPrompt('一段欢快的钢琴曲，像春天花园里的蝴蝶飞舞')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full hover:bg-primary/10 hover:text-primary transition-all">🌸 春日花园</button>
        <button onclick="setPrompt('忧伤的大提琴独奏，像雨夜窗边的思念')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full hover:bg-primary/10 hover:text-primary transition-all">🌧️ 雨夜思念</button>
        <button onclick="setPrompt('激昂的交响乐，像战场上的英雄凯旋')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full hover:bg-primary/10 hover:text-primary transition-all">⚔️ 英雄凯旋</button>
        <button onclick="setPrompt('宁静的古筝曲，像山间溪流的禅意')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full hover:bg-primary/10 hover:text-primary transition-all">🏔️ 山间禅意</button>
      </div>
    </div>

    <!-- 生成按钮 -->
    <button id="generateBtn" onclick="generateMusic()" class="w-full py-4 bg-gradient-to-r from-primary to-primary/80 text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all active:scale-[0.98]">
      <span class="flex items-center justify-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        开始AI创作
      </span>
    </button>

    <!-- 生成中状态 -->
    <div id="generatingState" class="hidden mt-8">
      <div class="bg-white rounded-2xl p-8 shadow-lg text-center">
        <div class="flex justify-center items-end gap-1 h-16 mb-4">
          <div class="wave-bar w-2 bg-primary rounded-full" style="height: 20%"></div>
          <div class="wave-bar w-2 bg-primary rounded-full" style="height: 40%"></div>
          <div class="wave-bar w-2 bg-secondary rounded-full" style="height: 60%"></div>
          <div class="wave-bar w-2 bg-primary rounded-full" style="height: 80%"></div>
          <div class="wave-bar w-2 bg-secondary rounded-full" style="height: 100%"></div>
          <div class="wave-bar w-2 bg-primary rounded-full" style="height: 70%"></div>
          <div class="wave-bar w-2 bg-primary rounded-full" style="height: 50%"></div>
          <div class="wave-bar w-2 bg-secondary rounded-full" style="height: 30%"></div>
        </div>
        <p class="text-primary font-bold text-lg typing" id="generatingText">正在分析您的灵感...</p>
        <div class="mt-4 bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p class="text-slate-400 text-xs mt-2" id="progressText">0%</p>
      </div>
    </div>

    <!-- 生成结果 -->
    <div id="resultState" class="hidden mt-8">
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- 结果头部 -->
        <div class="bg-gradient-to-r from-primary to-primary/90 p-6 text-white">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <div>
              <h3 class="font-bold">创作完成！</h3>
              <p class="text-white/70 text-sm">AI为您生成了专属音乐作品</p>
            </div>
          </div>
          <h2 class="text-xl font-serif font-bold" id="resultTitle">未命名作品 #001</h2>
          <div class="flex gap-2 mt-2">
            <span class="text-xs bg-white/20 px-2 py-1 rounded-full" id="resultStyle">古典</span>
            <span class="text-xs bg-white/20 px-2 py-1 rounded-full" id="resultInst">钢琴</span>
            <span class="text-xs bg-white/20 px-2 py-1 rounded-full">BPM 120</span>
          </div>
        </div>

        <!-- 音频播放器 -->
        <div class="p-6">
          <div class="bg-slate-50 rounded-xl p-4 mb-4">
            <div class="flex items-center gap-4">
              <button onclick="togglePlay()" id="playBtn" class="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white shadow-lg hover:bg-primary/90 transition-all">
                <svg id="playIcon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <div class="flex-1">
                <div class="flex justify-between text-xs text-slate-500 mb-1">
                  <span id="currentTime">0:00</span>
                  <span id="totalTime">2:35</span>
                </div>
                <div class="bg-slate-200 rounded-full h-2 cursor-pointer" onclick="seekAudio(event)">
                  <div id="audioProgress" class="bg-primary h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
              </div>
            </div>
            <!-- 音频波形可视化 -->
            <div class="flex items-center justify-center gap-px h-12 mt-4" id="waveform">
              ${Array(40).fill(0).map(() => `<div class="w-1 bg-primary/30 rounded-full transition-all duration-150" style="height: ${20 + Math.random() * 60}%"></div>`).join('')}
            </div>
          </div>

          <!-- 简单乐谱展示 -->
          <div class="mb-4">
            <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
              <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              生成乐谱预览
            </h4>
            <div class="bg-slate-50 rounded-xl p-4 overflow-x-auto">
              <div class="min-w-[500px]">
                <div class="text-xs text-slate-500 mb-2">C大调 · 4/4拍 · 120 BPM</div>
                <div class="space-y-3" id="sheetPreview">
                  <!-- 动态生成 -->
                </div>
              </div>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="grid grid-cols-2 gap-3">
            <button onclick="downloadResult()" class="py-3 bg-primary text-white rounded-xl font-bold hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              下载作品
            </button>
            <button onclick="shareResult()" class="py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
              分享作品
            </button>
          </div>
          <button onclick="generateAgain()" class="w-full mt-3 py-3 border-2 border-primary text-primary rounded-xl font-bold hover:bg-primary hover:text-white transition-all">
            重新创作
          </button>
        </div>
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="mt-8">
      <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        创作历史
      </h3>
      <div class="space-y-3" id="historyList">
        <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
          <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <div class="flex-1">
            <div class="font-medium text-sm">春日幻想曲</div>
            <div class="text-xs text-slate-400">古典 · 钢琴 · 2:35</div>
          </div>
          <button class="p-2 text-primary">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
          <div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center">
            <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
          </div>
          <div class="flex-1">
            <div class="font-medium text-sm">雨夜思念</div>
            <div class="text-xs text-slate-400">民谣 · 吉他 · 3:12</div>
          </div>
          <button class="p-2 text-primary">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="safe-bottom h-4"></div>

  <script>
    let currentMode = 'melody';
    let selectedStyles = [];
    let currentInstrument = 'piano';
    let isPlaying = false;
    let playInterval;
    let currentProgress = 0;

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        if (btn.dataset.mode === mode) {
          btn.classList.add('bg-primary', 'text-white');
          btn.classList.remove('bg-white', 'border-slate-200');
          btn.querySelector('svg').classList.remove('text-slate-400');
          btn.querySelector('.text-sm').classList.remove('text-slate-600');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('bg-white', 'border-slate-200');
          btn.querySelector('svg').classList.add('text-slate-400');
          btn.querySelector('.text-sm').classList.add('text-slate-600');
        }
      });
    }

    function toggleStyle(btn, style) {
      if (selectedStyles.includes(style)) {
        selectedStyles = selectedStyles.filter(s => s !== style);
        btn.classList.remove('bg-primary', 'text-white', 'border-primary');
        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
      } else {
        selectedStyles.push(style);
        btn.classList.add('bg-primary', 'text-white', 'border-primary');
        btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
      }
    }

    function selectInstrument(btn, inst) {
      currentInstrument = inst;
      document.querySelectorAll('.inst-btn').forEach(b => {
        b.classList.remove('bg-primary', 'text-white');
        b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      });
      btn.classList.add('bg-primary', 'text-white');
      btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
    }

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    function generateMusic() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt && selectedStyles.length === 0) {
        alert('请输入创作描述或选择风格');
        return;
      }

      document.getElementById('generateBtn').classList.add('hidden');
      document.getElementById('generatingState').classList.remove('hidden');
      document.getElementById('resultState').classList.add('hidden');

      const texts = [
        '正在分析您的灵感...',
        'AI正在理解音乐情感...',
        '生成旋律线条...',
        '编配和声进行...',
        '优化节奏结构...',
        '渲染音色效果...',
        '作品生成完毕！'
      ];

      let step = 0;
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const generatingText = document.getElementById('generatingText');

      const interval = setInterval(() => {
        step++;
        const progress = Math.min(step * 15, 100);
        progressBar.style.width = progress + '%';
        progressText.textContent = progress + '%';

        if (step < texts.length) {
          generatingText.textContent = texts[step];
        }

        if (step >= 7) {
          clearInterval(interval);
          setTimeout(() => {
            showResult(prompt);
          }, 500);
        }
      }, 800);
    }

    function showResult(prompt) {
      document.getElementById('generatingState').classList.add('hidden');
      document.getElementById('resultState').classList.remove('hidden');

      const styleNames = { classical: '古典', pop: '流行', jazz: '爵士', folk: '民谣', rock: '摇滚', electronic: '电子', chinese: '中国风', cinematic: '电影配乐' };
      const instNames = { piano: '钢琴', guitar: '吉他', violin: '小提琴', flute: '长笛' };

      document.getElementById('resultStyle').textContent = selectedStyles.length > 0 ? styleNames[selectedStyles[0]] : '古典';
      document.getElementById('resultInst').textContent = instNames[currentInstrument];

      const titles = ['晨曦微光', '星河漫步', '风之诗', '月光奏鸣', '雨后彩虹', '山间清泉', '城市霓虹', '时光回响'];
      document.getElementById('resultTitle').textContent = titles[Math.floor(Math.random() * titles.length)] + ' #' + String(Math.floor(Math.random() * 900) + 100).padStart(3, '0');

      // 生成模拟乐谱
      generateSheetPreview();
    }

    function generateSheetPreview() {
      const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
      const octaves = ['4', '5'];
      let html = '';

      for (let bar = 0; bar < 4; bar++) {
        html += '<div class="flex items-center gap-1 mb-2">';
        html += '<span class="text-xs text-slate-400 w-6">' + (bar + 1) + '.</span>';
        html += '<div class="flex-1 flex items-center gap-2">';

        for (let i = 0; i < 4; i++) {
          const note = notes[Math.floor(Math.random() * notes.length)];
          const octave = octaves[Math.floor(Math.random() * octaves.length)];
          const duration = ['♩', '♪', '♫'][Math.floor(Math.random() * 3)];
          html += '<div class="text-center">';
          html += '<div class="text-xs font-bold text-slate-700">' + note + octave + '</div>';
          html += '<div class="text-lg text-primary">' + duration + '</div>';
          html += '</div>';
        }
        html += '</div></div>';
      }

      document.getElementById('sheetPreview').innerHTML = html;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playIcon').classList.toggle('hidden');
      document.getElementById('pauseIcon').classList.toggle('hidden');

      if (isPlaying) {
        playInterval = setInterval(() => {
          currentProgress += 0.5;
          if (currentProgress >= 100) {
            currentProgress = 0;
            togglePlay();
          }
          document.getElementById('audioProgress').style.width = currentProgress + '%';

          const totalSeconds = 155;
          const currentSeconds = Math.floor(totalSeconds * currentProgress / 100);
          const mins = Math.floor(currentSeconds / 60);
          const secs = currentSeconds % 60;
          document.getElementById('currentTime').textContent = mins + ':' + String(secs).padStart(2, '0');

          // 波形动画
          document.querySelectorAll('#waveform div').forEach(bar => {
            bar.style.height = (20 + Math.random() * 60) + '%';
          });
        }, 100);
      } else {
        clearInterval(playInterval);
      }
    }

    function seekAudio(e) {
      const rect = e.target.getBoundingClientRect();
      const x = e.clientX - rect.left;
      currentProgress = (x / rect.width) * 100;
      document.getElementById('audioProgress').style.width = currentProgress + '%';
    }

    function downloadResult() {
      alert('作品已保存！\n\n下载内容包含：\n• MP3 音频文件\n• PDF 乐谱文件\n• MIDI 工程文件\n\n请前往"我的作品"查看下载记录。');
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({
          title: '我用AI创作了一首音乐',
          text: '快来听听我用琴和堂AI创作的音乐作品！',
          url: window.location.href
        });
      } else {
        alert('分享链接已复制！\n\n您可以分享到微信、朋友圈或微博。');
      }
    }

    function generateAgain() {
      document.getElementById('resultState').classList.add('hidden');
      document.getElementById('generateBtn').classList.remove('hidden');
      currentProgress = 0;
      document.getElementById('audioProgress').style.width = '0%';
      document.getElementById('currentTime').textContent = '0:00';
      if (isPlaying) togglePlay();
    }
  </script>
</body>
</html>
